[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secstream-bench"
version = "0.1.0"
description = "Benchmarkable streaming intrusion-detection pipeline"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka==2.6.1",
  "joblib==1.4.2",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "psutil==6.1.0",
  "scikit-learn==1.5.2",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.115.5",
  "pytest==8.3.3",
  "pytest-xdist==3.6.1",
  "ruff==0.7.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["artifacts", "results"]

[tool.pytest.ini_options]
markers = [
  "integration: requires the Redpanda broker",
  "slow: full benchmark or sweep, never run by default",
]